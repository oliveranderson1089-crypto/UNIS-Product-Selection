# ============================================================
# UNIS Product Selection — central configuration
# ============================================================
# All runtime defaults live here. Secrets live in .env.
# Change provider/model for a task by editing this file only;
# business code never references provider names directly.
# ============================================================

# ---------- LLM routing ----------
# Each task maps to (provider, model). Swap providers freely
# without touching business code.
llm:
  chat:
    provider: ollama          # local Ollama @ :11434 (OpenAI-compatible); was deepseek/deepseek-chat
    model: qwen2.5            # pulled tag (qwen2.5 -> qwen2.5:latest); must match `ollama list`
    temperature: 0.2
    max_tokens: 1024

  reasoning:
    provider: deepseek
    model: deepseek-reasoner
    temperature: 0.0
    max_tokens: 2048

  vision:
    provider: claude
    # `*-latest` aliases auto-track the current stable build; safer than
    # pinning a dated snapshot that Anthropic eventually retires.
    model: claude-haiku-4-5
    temperature: 0.2
    max_tokens: 1024

  # Embedding model for semantic retrieval (Chroma vector index). Runs on the
  # same local Ollama server as `chat`; pull it once with `ollama pull bge-m3`.
  # bge-m3 is multilingual (strong on Chinese) and emits 1024-dim vectors.
  # temperature/max_tokens are ignored by the embeddings endpoint but kept for
  # a uniform LLMTaskConfig shape.
  embedding:
    provider: ollama
    model: bge-m3
    temperature: 0.0
    max_tokens: 0

  # If a provider call fails, optionally fall back to another task.
  # null means no fallback. Used by LLMRouter.
  fallback:
    vision: null            # vision has no text fallback
    reasoning: chat         # if reasoner errors, retry with chat
    chat: null

  # Cap monthly spend per provider (CNY). 0 = no cap.
  budget_cny_monthly:
    deepseek: 0
    claude: 50

# ---------- Storage ----------
storage:
  data_dir: data
  sqlite_path: data/catalog.db
  pdf_dir: data/pdfs
  chroma_dir: data/chroma
  chroma_collection: unis_products

# ---------- Crawler ----------
crawler:
  base_url: https://www.unisyue.com
  # Full catalog scope: both 创新产品 (Autonomous_Controllable, IDs 11-15)
  # and 通用产品 (Commercial_Product, IDs 21-28). The crawler also reads
  # the authoritative ZH/EN name mapping from src/scraper/categories.py;
  # if a category is added on the site, register it there too.
  start_paths:
    # 创新产品 (innovation)
    - /Autonomous_Controllable/11/default.html   # 交换机
    - /Autonomous_Controllable/12/default.html   # 路由器
    - /Autonomous_Controllable/13/default.html   # 安全
    - /Autonomous_Controllable/14/default.html   # 计算存储
    - /Autonomous_Controllable/15/default.html   # 大模型一体机
    # 通用产品 (general)
    - /Commercial_Product/21/default.html        # 交换机
    - /Commercial_Product/22/default.html        # 路由器
    - /Commercial_Product/23/default.html        # 安全
    - /Commercial_Product/24/default.html        # 计算存储
    - /Commercial_Product/25/default.html        # 智能管理
    - /Commercial_Product/26/default.html        # 云计算
    - /Commercial_Product/27/default.html        # 大数据
    - /Commercial_Product/28/default.html        # 无线局域网
  request_timeout: 30
  retries: 3
  # TLS verification. Set false ONLY if you're behind a proxy that does
  # TLS interception (FlClash / corporate firewall) and you trust it.
  # The env var CRAWLER_VERIFY_SSL=false overrides this at runtime.
  verify_ssl: true
  # Optional: restrict to a subset of categories (Chinese names). Empty = all.
  category_whitelist: []
  # Skip products whose name matches any of these substrings.
  skip_keywords: []

# ---------- Selector ----------
selector:
  # Default mode: rule | ai
  default_mode: rule
  # Number of top candidates to return
  top_k: 5
  # When in AI mode, how many products to pass to the LLM as context
  ai_context_top_n: 20
  # Semantic recall: in AI mode, vector-search Chroma (bge-m3 embeddings) and
  # union those hits with the rule shortlist before the LLM rerank. This
  # surfaces products that match in meaning but not in exact keywords/specs.
  # Requires a built index: `python -m src.cli index build`. Falls back to the
  # rule shortlist alone when the index is empty or Ollama is unreachable.
  use_semantic: true
  # How many candidates the vector search recalls.
  semantic_top_n: 20
  # Vector-store backend for the semantic index:
  #   embedded — pure-Python numpy cosine store (default). Zero native deps;
  #              works on this Windows box where chromadb's wheel crashes on add().
  #   chroma   — Chroma PersistentClient (needs a working native wheel; use on
  #              Linux, or Windows via a Docker/WSL Chroma server).
  vector_backend: embedded
  # 创新/通用范围的选型粒度(分阶段计划):
  #   series — Phase 1:返回全线选型库的产品系列(型号级还未整理)
  #   model  — Phase 2:型号级表整理完成后切换
  # 名录范围不受此开关影响,始终匹配到具体型号。
  section_granularity: series

# ---------- Selection sources(人工整理的权威选型表) ----------
# 这两份 Excel 是非爬虫的权威选型数据源。支持 glob(取最新修改的文件)。
# 导入命令:
#   python -m src.cli catalog import-library          # 全线选型库 → 系列级产品
#   python -m src.cli catalog import-xlsx             # 名录对照表 → 型号级产品+名录
# 导入后记得重建语义索引:python -m src.cli index build
selection_sources:
  series_library: "D:/Work/紫光恒越/UNIS资料/5.辅助配置材料/常用/UNIS 全线产品选型库*.xlsx"
  catalog_xlsx: "D:/Work/紫光恒越/UNIS资料/5.辅助配置材料/常用/*名录_产品选型对照表*.xlsx"
  catalog_name: "紫光恒越2025年V1名录"

# ---------- Quotes (报价单编辑) ----------
quotes:
  # Path to IT产品BOM编码.xlsx — used to swap the default OEM service
  # line in server quotes with the proper "3年7×24×NBD维保" entry.
  # Glob patterns supported (most recent file wins by mtime), so just
  # drop new monthly BOM files into the folder below and the tool
  # auto-picks them up — no config edit needed.
  bom_path: "data/References/IT产品BOM编码*.xlsx"

  # Path to "R3800FT20 G3配置*.xlsx" (the 已选型 version) — used to
  # fill the R3800FT20 G3 server section with per-component breakdown.
  # Glob supported; files with "已选" in the name are preferred over the
  # bare template skeleton, then most-recent mtime wins.
  # NOTE: pattern is "配置*" (not "配置模板*") on purpose, so per-project
  # 已选型 exports like "R3800FT20 G3配置南充武警(已选型).xlsx" are also
  # picked up — otherwise a fresh upload that drops the literal "模板"
  # word would be classified as a FT20 模板 in the UI but silently never
  # become the active file.
  r3800ft20_template_path: "data/References/R3800FT20 G3配置*.xlsx"

# ---------- Projects ----------
# Project = one sales/pre-sales opportunity. The scanner walks
# work_dir/<assigner>/<project_code>/<files> and upserts a Project row
# per project folder. Override paths per-machine via PROJECTS_WORK_DIR env var.
projects:
  work_dir: "D:/Work/紫光恒越/日常工作"
  # Folder names to skip at the top level (e.g. shared notes, archives)
  skip_top_level: []
  # Filenames to skip everywhere (anywhere in the tree)
  skip_files:
    - "说明.txt"
    - "Thumbs.db"
    - ".DS_Store"
    - "~$*"               # Microsoft Office lock files

# ---------- Scheduler ----------
scheduler:
  enabled: false              # Set true to run periodic updates
  crawl_cron: "0 3 * * 1"     # Weekly Mon 03:00
  timezone: Asia/Shanghai

# ---------- Logging ----------
logging:
  level: INFO                 # DEBUG | INFO | WARNING | ERROR
  file: logs/app.log
